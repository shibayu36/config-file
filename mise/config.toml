[bootstrap.brew]
# 手動で入れた既存アプリをbrew管理下に取り込む
adopt = true

[bootstrap.packages]
# 基本ツール
"brew:coreutils" = "latest"
"brew:gnu-sed" = "latest"
"brew:gawk" = "latest"
"brew:bash" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:git-lfs" = "latest"
"brew:git-fixup" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:tig" = "latest"
"brew:lazygit" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"
"brew:colordiff" = "latest"
"brew:gojq" = "latest"

# シェル環境
"brew:herdr" = "latest"
"brew:tmux" = "latest"
"brew:fzf" = "latest"
"brew:ripgrep" = "latest"
"brew:direnv" = "latest"
"brew:starship" = "latest"
"brew:keychain" = "latest"
"brew:asdf" = "latest"
"brew:uv" = "latest"
"brew:vjeantet/tap/alerter" = "latest"

# herdr/tmuxのpane内でもsudoのTouch IDを効かせるため
"brew:pam-reattach" = "latest"

