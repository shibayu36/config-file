[dotfiles]
"~/.gitconfig" = { source = "~/development/config-file/.gitconfig" }
"~/.zprofile" = { source = "~/development/config-file/.zprofile" }
"~/.zshenv" = { source = "~/development/config-file/.zshenv" }
"~/.zshrc" = { source = "~/development/config-file/.zshrc" }
"~/.zshrc.function" = { source = "~/development/config-file/.zshrc.function" }
"~/.zsh" = { source = "~/development/config-file/.zsh" }
"~/.gitignore" = { source = "~/development/config-file/.gitignore" }
"~/.proverc" = { source = "~/development/config-file/.proverc" }
"~/.my.cnf" = { source = "~/development/config-file/.my.cnf" }
"~/.inputrc" = { source = "~/development/config-file/.inputrc" }
"~/.tmux.conf" = { source = "~/development/config-file/.tmux.conf" }
"~/.tigrc" = { source = "~/development/config-file/.tigrc" }
"~/.vscode-powertools" = { source = "~/development/config-file/.vscode-powertools" }
"~/.textlintrc" = { source = "~/development/config-file/.textlintrc" }
"~/.coderabbit.yml" = { source = "~/development/config-file/.coderabbit.yml" }
"~/.config/karabiner" = { source = "~/development/config-file/karabiner" }
"~/.config/starship.toml" = { source = "~/development/config-file/starship.toml" }
"~/.config/deck" = { source = "~/development/config-file/deck" }
"~/.config/herdr/config.toml" = { source = "~/development/config-file/herdr/config.toml" }
"~/Library/KeyBindings" = { source = "~/development/config-file/KeyBindings" }
"~/Library/Application Support/lazygit/config.yml" = { source = "~/development/config-file/lazygit/config.yml" }
"~/Library/Application Support/lazygit/tig.yml" = { source = "~/development/config-file/lazygit/tig.yml" }
"~/Library/Application Support/com.mitchellh.ghostty/config" = { source = "~/development/config-file/ghostty/config" }
"~/Library/Application Support/Code/User/settings.json" = { source = "~/development/config-file/vscode/settings.json" }
"~/Library/Application Support/Code/User/keybindings.json" = { source = "~/development/config-file/vscode/keybindings.json" }
"~/Library/Application Support/Code/User/snippets" = { source = "~/development/config-file/vscode/snippets" }
"~/Library/Application Support/Cursor/User/settings.json" = { source = "~/development/config-file/cursor/settings.json" }
"~/Library/Application Support/Cursor/User/keybindings.json" = { source = "~/development/config-file/cursor/keybindings.json" }
"~/Library/Application Support/Cursor/User/snippets" = { source = "~/development/config-file/vscode/snippets" }
# Claude／Codexの設定ディレクトリにはローカルデータもあるため、管理対象だけをリンクする
"~/.claude/CLAUDE.md" = { source = "~/development/config-file/claude/CLAUDE.md" }
"~/.claude/settings.json" = { source = "~/development/config-file/claude/settings.json" }
"~/.claude/keybindings.json" = { source = "~/development/config-file/claude/keybindings.json" }
"~/.claude/scripts" = { source = "~/development/config-file/claude/scripts" }
"~/.codex/AGENTS.md" = { source = "~/development/config-file/codex/AGENTS.md" }
"~/.codex/hooks.json" = { source = "~/development/config-file/codex/hooks.json" }
"~/.codex/keybindings.json" = { source = "~/development/config-file/codex/keybindings.json" }
"~/.codex/rules/common.rules" = { source = "~/development/config-file/codex/rules/common.rules" }
# CodexがMCPのトークンや[projects.*]を書き込むため、リンクせず共通設定のキーだけをマージする
"~/.codex/config.toml/base" = { source = "~/development/config-file/codex/config.base.toml", merge = true }

[dotfile_groups.bin]
root = "~/development/config-file/bin"
target = "~/bin"

[dotfile_groups.claude-agents]
root = "~/development/config-file/claude/agents"
target = "~/.claude/agents"

[bootstrap.macos.defaults.NSGlobalDomain]
# キーリピートを最速に
KeyRepeat = 2
InitialKeyRepeat = 15
# 自動テキスト置換（大文字化・ピリオド・スマート引用符・スマートダッシュ・スペル修正）をOFF
NSAutomaticCapitalizationEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticSpellingCorrectionEnabled = false
# F1〜F12を標準のファンクションキーとして使う
"com.apple.keyboard.fnState" = true
# トラックパッドのポインタの速度を速く。statusは型も比較するのでfloatで書く
"com.apple.trackpad.scaling" = 2.0
# ナチュラルスクロールをOFF
"com.apple.swipescrolldirection" = false
# 「ページ間をスワイプ」をOFFにし、2本指の左右スワイプで戻る・進むが発火しないようにする
AppleEnableSwipeNavigateWithScrolls = false

# Ctrl+Spaceの「前の入力ソースを選択」を無効化し、エディタ側のCtrl+Spaceを使えるようにする。入力ソースの切り替えはKarabinerの英数/かなキーで行う
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"]
value = { enabled = false, value = { parameters = [32, 49, 262144], type = "standard" } }

# 「次のウィンドウを操作対象にする」をCommand+F1に変更する（デフォルトはCommand+`）
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["27"]
value = { enabled = true, value = { parameters = [65535, 122, 9437184], type = "standard" } }

# トラックパッドのタップでクリック
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = true
[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true

# 隠しファイルを表示し、デフォルトを列表示にする
[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
FXPreferredViewStyle = "clmv"

# 保存先を~/Downloadsにし、撮影後のサムネイルプレビューを出さない。
# miseは~を展開しないが、macOSのスクリーンショット機能が~を展開する
[bootstrap.macos.defaults."com.apple.screencapture"]
location = "~/Downloads"
show-thumbnail = false

[bootstrap.macos.launchd.agents.scheduled-pull-config-file]
program = "~/development/config-file/scripts/scheduled-pull-config-file.sh"
run_at_load = true
# start_intervalと違い、スリープ中に逃した実行も復帰後にまとめて1回実行される
start_calendar_interval = { minute = 0 }

[tasks.bootstrap]
run = "~/development/config-file/scripts/mise-bootstrap-task.sh"
